[package]
name = "spectra-viz"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
parquet = "60.1.0"
arrow-array = "60.1.0"
arrow-schema = "60.1.0"
anyhow = "1"
libc = "0.2"
cosmolkit = { version = "0.5.1-rc.3", default-features = false, features = ["core", "depict"] }
image = { version = "0.25", default-features = false, features = ["png"] }
